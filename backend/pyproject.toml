[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftshield"
version = "0.1.0"
description = "DriftShield Phase 1 — ML foundation: reproducible stream simulator, evaluator, and logistic-regression baseline"
requires-python = ">=3.9"
dependencies = [
    "river==0.21.2",
    "numpy>=1.24,<2.0",
    "pydantic>=2.0,<3.0",
    "scikit-learn>=1.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
driftshield-run = "driftshield.run_baseline:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
